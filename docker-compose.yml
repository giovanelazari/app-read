services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VAPID_CLAIM_EMAIL: ${VAPID_CLAIM_EMAIL}
      WEB_URL: ${WEB_URL}
      TZ: America/Sao_Paulo
    volumes:
      - ./data/playwright:/data/playwright
      - ./data/vapid:/data/vapid
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.kindle-api.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.kindle-api.entrypoints=websecure"
      - "traefik.http.routers.kindle-api.tls=true"
      - "traefik.http.routers.kindle-api.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.kindle-api.loadbalancer.server.port=8000"
    restart: unless-stopped
    networks:
      - internal
      - traefik

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: https://${API_HOST}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.kindle-web.rule=Host(`${WEB_HOST}`)"
      - "traefik.http.routers.kindle-web.entrypoints=websecure"
      - "traefik.http.routers.kindle-web.tls=true"
      - "traefik.http.routers.kindle-web.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.kindle-web.loadbalancer.server.port=80"
    restart: unless-stopped
    networks:
      - traefik

networks:
  internal:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
