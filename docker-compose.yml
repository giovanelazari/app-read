# Local-development compose file. Use `docker compose up` on a workstation.
# For production deployment on the VPS, see docker-compose.stack.yml + deploy.sh.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VAPID_CLAIM_EMAIL: ${VAPID_CLAIM_EMAIL}
      WEB_URL: ${WEB_URL}
      TZ: America/Sao_Paulo
    ports:
      - "8000:8000"
    volumes:
      - ./data/playwright:/data/playwright
      - ./data/vapid:/data/vapid
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${WEB_URL_API:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
